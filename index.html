<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Log</title>
<meta name="theme-color" content="#14385A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pit Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-64.png?v=4">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#EEF2F0;
    --surface:#FFFFFF;
    --surface-2:#E2E8E5;
    --ink:#16201D;
    --ink-muted:#5A6763;
    --ink-faint:#8B9793;
    --border:#D6DEDA;
    --accent:#1B4B72;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCE7F1;
    --fuel:#0A8CAA;
    --fuel-soft:#D5EEF4;
    --good:#157A54;
    --good-soft:#DCEEE4;
    --warn:#B4790A;
    --warn-soft:#F3E7CE;
    --maint:#3E5C78;
    --maint-soft:#E1E8EE;
    --shadow: 0 1px 2px rgba(22,32,29,0.06), 0 6px 16px -8px rgba(22,32,29,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10140F;
      --surface:#1A211B;
      --surface-2:#212A22;
      --ink:#EAF1EC;
      --ink-muted:#9CACA4;
      --ink-faint:#6E7C74;
      --border:#2C3830;
      --accent:#5BB0E0;
      --accent-ink:#06192A;
      --accent-soft:#16293A;
      --fuel:#38C6E0;
      --fuel-soft:#12333B;
      --good:#4FBE94;
      --good-soft:#173327;
      --warn:#E0A93E;
      --warn-soft:#332A14;
      --maint:#8FADCC;
      --maint-soft:#1E2A36;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10140F;
    --surface:#1A211B;
    --surface-2:#212A22;
    --ink:#EAF1EC;
    --ink-muted:#9CACA4;
    --ink-faint:#6E7C74;
    --border:#2C3830;
    --accent:#5BB0E0;
    --accent-ink:#06192A;
    --accent-soft:#16293A;
      --fuel:#38C6E0;
      --fuel-soft:#12333B;
    --good:#4FBE94;
    --good-soft:#173327;
    --warn:#E0A93E;
    --warn-soft:#332A14;
    --maint:#8FADCC;
    --maint-soft:#1E2A36;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP","Zen Kaku Gothic New",-apple-system,sans-serif;
    padding-inline:16px;
    padding-block: 0 96px;
  }
  .mono{ font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  h1,h2,h3{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; margin:0; text-wrap:balance; }
  button{ font-family:inherit; }

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px);
    background:var(--bg);
    padding-block:14px 10px;
    z-index:20;
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    border-bottom:1px solid transparent;
  }
  header.top .brand{ display:flex; flex-direction:column; gap:2px; }
  header.top h1{ font-size:20px; font-weight:900; letter-spacing:.01em; }
  header.top .sub{ font-size:11.5px; color:var(--ink-muted); }
  header.top .today{ font-size:12px; color:var(--ink-faint); text-align:right; white-space:nowrap; }

  main{ max-width:560px; margin-inline:auto; display:flex; flex-direction:column; gap:22px; }

  /* stat tiles */
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:12px 10px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px; min-width:0;
  }
  .tile .label{ font-size:10.5px; color:var(--ink-muted); font-weight:500; letter-spacing:.02em; }
  .tile .value{ font-size:19px; font-weight:700; line-height:1.1; display:flex; align-items:baseline; gap:3px; }
  .tile .value .unit{ font-size:10.5px; font-weight:500; color:var(--ink-muted); }
  .tile .delta{ font-size:10.5px; font-weight:500; }
  .tile .delta.up{ color:var(--good); }
  .tile .delta.down{ color:var(--warn); }

  /* chart */
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:14px 14px 10px; box-shadow:var(--shadow);
  }
  .panel .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .panel .panel-head h2{ font-size:13.5px; font-weight:700; }
  .panel .panel-head .avg{ font-size:11px; color:var(--ink-muted); }
  .chart-wrap{ position:relative; }
  svg.chart{ display:block; width:100%; height:auto; overflow:visible; }
  .chart .gridline{ stroke:var(--border); stroke-width:1; }
  .chart .avgline{ stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3; }
  .chart .area{ fill:var(--accent); opacity:.12; }
  .chart .line{ fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .chart .dot{ fill:var(--surface); stroke:var(--accent); stroke-width:2; cursor:pointer; }
  .chart .dot.active{ fill:var(--accent); }
  .chart .axislabel{ fill:var(--ink-faint); font-size:9px; font-family:"JetBrains Mono",monospace; }
  .chart-empty{ font-size:12.5px; color:var(--ink-muted); padding:20px 4px 24px; text-align:center; }
  .tooltip{
    position:absolute; pointer-events:none; background:var(--ink); color:var(--bg);
    font-size:11px; padding:5px 8px; border-radius:8px; white-space:nowrap;
    transform:translate(-50%,-120%); opacity:0; transition:opacity .1s ease; z-index:5;
  }
  .tooltip.show{ opacity:1; }

  /* filter chips */
  .chips{ display:flex; gap:6px; }
  .chip{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-muted);
    font-size:12px; font-weight:500; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* log list */
  .log{ display:flex; flex-direction:column; gap:8px; }
  .log-head{ display:flex; align-items:center; justify-content:space-between; }
  .log-head h2{ font-size:13.5px; font-weight:700; }
  .card{
    display:flex; gap:10px; align-items:stretch;
    background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:11px 12px; box-shadow:var(--shadow); cursor:pointer; text-align:left; width:100%;
  }
  .card .stripe{ width:3px; border-radius:3px; flex-shrink:0; }
  .card.fuel .stripe{ background:var(--fuel); }
  .card.maintenance .stripe{ background:var(--maint); }
  .card.cost .stripe{ background:var(--warn); }
  .card .body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .card .row1{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card .date{ font-size:12px; color:var(--ink-muted); font-weight:500; }
  .card .kind{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; letter-spacing:.02em; }
  .card.fuel .kind{ background:var(--fuel-soft); color:var(--fuel); }
  .card.maintenance .kind{ background:var(--maint-soft); color:var(--maint); }
  .card.cost .kind{ background:var(--warn-soft); color:var(--warn); }
  .card .main{ font-size:14px; font-weight:700; }
  .card .meta{ font-size:11.5px; color:var(--ink-muted); display:flex; flex-wrap:wrap; gap:x 8px; gap:2px 10px; }
  .card .eff{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; align-self:flex-start; }
  .eff.good{ background:var(--good-soft); color:var(--good); }
  .eff.warn{ background:var(--warn-soft); color:var(--warn); }
  .eff.flat{ background:var(--surface-2); color:var(--ink-faint); }
  .empty-log{ font-size:12.5px; color:var(--ink-muted); padding:24px 4px; text-align:center; }

  /* fab */
  .fab{
    position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%; border:none;
    background:var(--accent); color:var(--accent-ink); font-size:26px; line-height:1;
    box-shadow:0 6px 18px -4px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:30;
  }
  .fab:active{ transform:scale(.94); }
  .fab-photo{
    position:fixed; right:20px; bottom:calc(88px + env(safe-area-inset-bottom,0px));
    width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:18px;
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:30;
  }
  .fab-photo:active{ transform:scale(.94); }
  .fab-photo[hidden]{ display:none; }


  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,14,11,.45); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .overlay[hidden]{ display:none; }
  .sheet{
    width:100%; max-width:560px; background:var(--surface);
    border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    max-height:88vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.25);
  }
  .sheet h2{ font-size:16px; font-weight:700; margin-bottom:14px; }
  .scan-btn{ width:100%; padding:12px; border-radius:11px; border:1px dashed var(--accent); background:var(--surface-2); color:var(--accent); font-weight:700; font-size:14px; cursor:pointer; margin-bottom:6px; }
  .scan-btn:disabled{ opacity:.6; cursor:default; }
  .scan-msg{ font-size:12.5px; color:var(--good); min-height:1.2em; margin:0 0 10px; }
  .scan-msg.err{ color:var(--warn); }
  .scan-wrap[hidden]{ display:none; }
  .type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .type-toggle button{
    flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink-muted); font-weight:700; font-size:13px; cursor:pointer;
  }
  .type-toggle button[hidden]{ display:none; }
  .type-toggle button[aria-pressed="true"].t-fuel{ background:var(--fuel-soft); color:var(--fuel); border-color:var(--fuel); }
  .type-toggle button[aria-pressed="true"].t-maint{ background:var(--maint-soft); color:var(--maint); border-color:var(--maint); }
  .type-toggle button[aria-pressed="true"].t-cost{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:12px; font-weight:500; color:var(--ink-muted); }
  .field input, .field textarea{
    font-family:inherit; font-size:15px; padding:10px 11px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg); color:var(--ink); width:100%;
  }
  .field select{
    font-family:inherit; font-size:15px; padding:10px 11px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg); color:var(--ink); width:100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field .computed{ font-size:11px; color:var(--ink-faint); }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ padding:12px; border-radius:11px; font-weight:700; font-size:14px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); cursor:pointer; flex:1; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.danger{ background:transparent; color:var(--warn); border-color:var(--warn); flex:0 0 auto; }
  .btn.danger.confirm{ background:var(--warn); color:var(--accent-ink); }
  .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:-2px; margin-bottom:14px; }


  /* 費用パネル */
  .costpanel{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); }
  .costpanel .ch{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .costpanel h2{ font-size:13.5px; font-weight:700; }
  .costpanel .seg{ display:flex; gap:4px; }
  .costpanel .seg button{ border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); font-size:11.5px; font-weight:500; padding:4px 10px; border-radius:999px; cursor:pointer; }
  .costpanel .seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .costpanel .total{ font-size:24px; font-weight:700; line-height:1.1; }
  .costpanel .totalsub{ font-size:11px; color:var(--ink-muted); margin:2px 0 10px; }
  .costrow{ display:grid; grid-template-columns:84px 1fr auto; gap:8px; align-items:center; padding:3px 0; font-size:12px; }
  .costrow .nm{ color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .costrow .bar{ height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .costrow .bar i{ display:block; height:100%; background:var(--accent); border-radius:4px; }
  .costrow .am{ font-weight:700; text-align:right; }
  .cost-empty{ font-size:12.5px; color:var(--ink-muted); padding:6px 0 4px; }
  /* 内訳の行 */
  .itemrow{ display:grid; grid-template-columns:1fr 84px auto; gap:6px; margin-bottom:6px; align-items:center; }
  .itemrow input, .itemrow select{ min-width:0; font-family:inherit; font-size:14px; padding:8px 9px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--ink); width:100%; }
  .itemrow .grp{ grid-column:1 / 3; }
  .itemrow .del{ border:none; background:transparent; color:var(--ink-faint); font-size:20px; line-height:1; cursor:pointer; padding:4px 8px; }
  .itemrow + .itemrow{ margin-top:2px; padding-top:6px; border-top:1px dashed var(--border); }
  .btn-add{ border:1px dashed var(--border); background:transparent; color:var(--ink-muted); font-size:13px; padding:8px; border-radius:10px; cursor:pointer; width:100%; margin-bottom:8px; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  /* header settings button */
  .icon-btn{ background:var(--surface); border:1px solid var(--border); color:var(--ink-muted);
    width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  header.top .right{ display:flex; align-items:center; gap:10px; }
  .settings-text{ font-size:12.5px; color:var(--ink-muted); line-height:1.7; margin:0 0 14px; }
  .settings-msg{ font-size:12.5px; margin:10px 0 0; min-height:1.2em; color:var(--good); }
  .settings-msg.err{ color:var(--warn); }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; -webkit-tap-highlight-color:transparent; }

</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Pit Log</h1>
  </div>
  <div class="right">
    <div class="today mono" id="todayLabel"></div>
    <button class="icon-btn" id="fabSettings" type="button" aria-label="バックアップと設定"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M19.39 10.23 L22.12 10.72 L22.12 13.28 L19.39 13.77 L18.48 15.97 L20.06 18.25 L18.25 20.06 L15.97 18.48 L13.77 19.39 L13.28 22.12 L10.72 22.12 L10.23 19.39 L8.03 18.48 L5.75 20.06 L3.94 18.25 L5.52 15.97 L4.61 13.77 L1.88 13.28 L1.88 10.72 L4.61 10.23 L5.52 8.03 L3.94 5.75 L5.75 3.94 L8.03 5.52 L10.23 4.61 L10.72 1.88 L13.28 1.88 L13.77 4.61 L15.97 5.52 L18.25 3.94 L20.06 5.75 L18.48 8.03 Z M12 8.6a3.4 3.4 0 1 0 0 6.8a3.4 3.4 0 1 0 0-6.8Z"/></svg></button>
  </div>
</header>

<main>
  <section class="stats" aria-label="サマリー">
    <div class="tile">
      <div class="label">最新燃費</div>
      <div class="value mono" id="statLatest">—<span class="unit">km/L</span></div>
      <div class="delta" id="statLatestDelta"></div>
    </div>
    <div class="tile">
      <div class="label">通算燃費</div>
      <div class="value mono" id="statAvg">—<span class="unit">km/L</span></div>
      <div class="delta" id="statAvgDelta"></div>
    </div>
    <div class="tile">
      <div class="label">総走行距離</div>
      <div class="value mono" id="statDistance">—<span class="unit">km</span></div>
      <div class="delta" id="statCount"></div>
    </div>
  </section>

  <section class="costpanel" id="costPanel" aria-label="費用">
    <div class="ch">
      <h2>かかった費用</h2>
      <div class="seg" role="group" aria-label="期間">
        <button type="button" data-range="year" aria-pressed="true">今年</button>
        <button type="button" data-range="all" aria-pressed="false">全期間</button>
      </div>
    </div>
    <div class="total mono" id="costTotal">—</div>
    <div class="totalsub" id="costSub"></div>
    <div id="costRows"></div>
  </section>

  <section class="log">
    <div class="log-head">
      <h2>記録</h2>
      <div class="chips" role="group" aria-label="絞り込み">
        <button class="chip" data-filter="all" aria-pressed="true">すべて</button>
        <button class="chip" data-filter="fuel" aria-pressed="false">給油</button>
        <button class="chip" data-filter="cost" aria-pressed="false">その他</button>
      </div>
    </div>
    <div id="logList"></div>
  </section>
</main>

<button class="fab" id="fabAdd" aria-label="記録を追加">+</button>

<div class="overlay" id="settingsOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">バックアップ</h2>
    <p class="settings-text">記録はこのスマホの中に保存されています。機種変更や万一の消失に備えて、ときどきファイルに書き出しておくと安心です。書き出したファイルを読み込めば、記録を元に戻せます。</p>
    <div class="stack">
      <button type="button" class="btn primary" id="btnExport">記録をファイルに書き出す</button>
      <button type="button" class="btn" id="btnImportFile">ファイルから読み込む</button>
    </div>
    <p class="settings-text" style="margin-top:12px">読み込みは「追加・上書き」です。いま入っている記録が消えることはありません(同じ記録は上書きされます)。</p>
    <div class="settings-msg" id="settingsMsg" role="status"></div>
    <div class="sheet-actions"><button type="button" class="btn" id="btnSettingsClose">閉じる</button></div>
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">記録を追加</h2>
    <div class="scan-wrap" id="scanWrap">
      <button type="button" class="scan-btn" id="btnScan">📷 写真から入力(レシート・請求書)</button>
      <div class="scan-msg" id="scanMsg" role="status"></div>
      <input type="file" id="scanInput" accept="image/*" hidden>
    </div>
    <div class="type-toggle">
      <button type="button" class="t-fuel" data-type="fuel" aria-pressed="true">⛽ 給油</button>
      <button type="button" class="t-maint" id="btnTypeMaint" data-type="maintenance" aria-pressed="false" hidden>🔧 整備・車検</button>
      <button type="button" class="t-cost" data-type="cost" aria-pressed="false">💴 その他の支出</button>
    </div>
    <form id="entryForm">
      <div class="field">
        <label for="f-date">日付</label>
        <input type="date" id="f-date" required>
      </div>

      <div class="field" id="field-odo">
        <label for="f-odo">メーター(km)・いまの総走行距離</label>
        <input type="number" id="f-odo" inputmode="numeric" min="0" step="1" placeholder="例: 36887">
        <div class="computed" id="odoComputed"></div>
      </div>

      <div class="field" id="field-distance">
        <label for="f-distance">走行距離(前回給油から)</label>
        <input type="number" id="f-distance" inputmode="numeric" min="0" step="1" placeholder="例: 480">
      </div>

      <div id="costFields" hidden>

  // 端末の現地時間での今日 (UTCだと日本の午前中に前日になるため)
  function localISO(d){
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear() + '-' + (m<10?'0':'') + m + '-' + (day<10?'0':'') + day;
  }
  var todayISO = localISO(new Date());
  els.today.textContent = fmtDateLong(todayISO);

  var state = {
    entries: [],
    filter: 'all',
    editingId: null,
    currentType: 'fuel',
    costRange: 'year',
    deleteArmed: false,
    scanned: false,
    showCat: false
  };

  var fOdo = document.getElementById('f-odo');
  var fieldOdo = document.getElementById('field-odo');
  var odoComputed = document.getElementById('odoComputed');

  function fmtDateLong(iso){
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return (d.getMonth()+1) + '/' + d.getDate() + ' (' + ['日','月','火','水','木','金','土'][d.getDay()] + ')';
  }
  function fmtDateShort(iso){
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function yen(n){
    if (n === null || n === undefined || isNaN(n)) return null;
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }
  function num(n, digits){
    if (n === null || n === undefined || isNaN(n)) return null;
    return (digits === 0) ? Math.round(n).toLocaleString('ja-JP') : Number(n.toFixed(digits)).toLocaleString('ja-JP', {minimumFractionDigits:digits, maximumFractionDigits:digits});
  }
  function computeEfficiency(e){
    if (e.type !== 'fuel') return null;
    if (typeof e.distanceKm === 'number' && e.distanceKm > 0 && typeof e.liters === 'number' && e.liters > 0){
      return e.distanceKm / e.liters;
    }
    return null;
  }

  /* ---------- rendering ---------- */

  function render(){
    var entries = state.entries.slice().sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    renderStats(entries);
    renderCosts(entries);
    renderChart(entries);
    renderLog(entries);
  }

  function renderStats(entries){
    var fuelWithEff = entries.filter(function(e){ return e.type==='fuel' && computeEfficiency(e) !== null; });
    var avg = fuelWithEff.length ? fuelWithEff.reduce(function(s,e){ return s+computeEfficiency(e); },0) / fuelWithEff.length : null;
    var latestFuel = entries.find(function(e){ return e.type==='fuel'; });
    var latestEff = latestFuel ? computeEfficiency(latestFuel) : null;
    var odoVals = entries.filter(function(e){ return e.type==='fuel' && typeof e.odometerKm==='number'; }).map(function(e){ return e.odometerKm; });
    var maxOdo = odoVals.length ? Math.max.apply(null, odoVals) : null;
    var fuelCount = entries.filter(function(e){ return e.type==='fuel'; }).length;

    els.statAvg.innerHTML = (avg!==null ? num(avg,1) : '—') + '<span class="unit">km/L</span>';
    var startDate = fuelWithEff.length ? fuelWithEff.map(function(e){ return e.date; }).sort()[0] : null;
    els.statAvgDelta.textContent = startDate ? (startDate.slice(0,4) + '/' + parseInt(startDate.slice(5,7),10) + '/' + parseInt(startDate.slice(8,10),10) + '-') : '';

    els.statLatest.innerHTML = (latestEff!==null ? num(latestEff,1) : '—') + '<span class="unit">km/L</span>';
    if (latestEff!==null && avg!==null && fuelWithEff.length>1){
      var diff = latestEff - avg;
      var pct = avg ? (diff/avg*100) : 0;
      els.statLatestDelta.textContent = (diff>=0?'通算+':'通算') + pct.toFixed(0) + '%';
      els.statLatestDelta.className = 'delta ' + (diff>=0?'up':'down');
    } else {
      els.statLatestDelta.textContent = latestFuel ? fmtDateShort(latestFuel.date) : '';
      els.statLatestDelta.className = 'delta';
    }

    els.statDistance.innerHTML = (maxOdo!==null ? num(maxOdo,0) : '—') + '<span class="unit">km</span>';
    els.statCount.textContent = '給油 ' + fuelCount + '回';
  }


  /* ---------- 費用の集計 ---------- */

  function amountOf(e){
    return (typeof e.amount === 'number' && isFinite(e.amount)) ? e.amount : 0;
  }
  function costLabel(e){
    if (e.type === 'fuel') return '給油';
    if (e.type === 'maintenance') return '整備・車検';
    return e.category || 'その他';
  }

  function renderCosts(entries){
    var year = todayISO.slice(0,4);
    var list = entries.filter(function(e){
      return amountOf(e) > 0 && (state.costRange === 'all' || (e.date || '').slice(0,4) === year);
    });
    var total = list.reduce(function(s,e){ return s + amountOf(e); }, 0);
    var by = {};
    list.forEach(function(e){ var k = costLabel(e); by[k] = (by[k] || 0) + amountOf(e); });
    var keys = Object.keys(by).sort(function(a,b){ return by[b] - by[a]; });

    els.costRangeBtns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.range === state.costRange ? 'true' : 'false'); });
    els.costTotal.textContent = total > 0 ? yen(total) : '—';

    // 期間の説明(月あたり)
    var sub = '';
    if (total > 0){
      var months;
      if (state.costRange === 'year'){
        months = Math.max(1, parseInt(todayISO.slice(5,7), 10));
        sub = year + '年 · 月あたり ' + yen(total / months);
      } else {
        var first = list.map(function(e){ return e.date; }).sort()[0];
        var fy = parseInt(first.slice(0,4),10), fm = parseInt(first.slice(5,7),10);
        var ty = parseInt(todayISO.slice(0,4),10), tm = parseInt(todayISO.slice(5,7),10);
        months = Math.max(1, (ty - fy) * 12 + (tm - fm) + 1);
        sub = first.slice(0,4) + '/' + fm + '〜 · 月あたり ' + yen(total / months);
      }
    }
    els.costSub.textContent = sub;

    els.costRows.innerHTML = '';
    if (!keys.length){
      var empty = document.createElement('div'); empty.className = 'cost-empty';
      empty.textContent = '金額のある記録がまだありません';
      els.costRows.appendChild(empty);
      return;
    }
    var max = by[keys[0]];
    keys.forEach(function(k){
      var row = document.createElement('div'); row.className = 'costrow';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = k;
      var bar = document.createElement('div'); bar.className = 'bar';
      var fill = document.createElement('i'); fill.style.width = Math.max(3, by[k] / max * 100) + '%';
      bar.appendChild(fill);
      var am = document.createElement('div'); am.className = 'am mono'; am.textContent = yen(by[k]);
      row.appendChild(nm); row.appendChild(bar); row.appendChild(am);
      els.costRows.appendChild(row);
    });
  }

  els.costRangeBtns.forEach(function(b){
    b.addEventListener('click', function(){ state.costRange = b.dataset.range; render(); });
  });

  function renderChart(entries){
    if (!els.chartWrap) return;   // 燃費の推移パネルは非表示
    var pts = entries.filter(function(e){ return e.type==='fuel' && computeEfficiency(e)!==null; })
      .slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; })
      .slice(-14);

    els.chartWrap.querySelectorAll('svg').forEach(function(n){ n.remove(); });

    if (pts.length < 2){
      els.chartEmpty.hidden = false;
      els.chartRange.textContent = '';
      return;
    }
    els.chartEmpty.hidden = true;

    var vals = pts.map(function(p){ return computeEfficiency(p); });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var pad = (max-min) * 0.25 || max*0.15 || 1;
    var yMin = Math.max(0, min - pad), yMax = max + pad;
    var avg = vals.reduce(function(s,v){return s+v;},0)/vals.length;

    els.chartRange.textContent = fmtDateShort(pts[0].date) + ' 〜 ' + fmtDateShort(pts[pts.length-1].date);

    var W = 500, H = 150, padL = 34, padR = 10, padT = 12, padB = 20;
    var innerW = W - padL - padR, innerH = H - padT - padB;

    function x(i){ return padL + (pts.length===1 ? innerW/2 : innerW * i/(pts.length-1)); }
    function y(v){ return padT + innerH * (1 - (v - yMin)/(yMax - yMin || 1)); }

    var linePath = pts.map(function(p,i){ return (i===0?'M':'L') + x(i).toFixed(1) + ',' + y(computeEfficiency(p)).toFixed(1); }).join(' ');
    var areaPath = linePath + ' L' + x(pts.length-1).toFixed(1) + ',' + (padT+innerH).toFixed(1) + ' L' + x(0).toFixed(1) + ',' + (padT+innerH).toFixed(1) + ' Z';

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 ' + W + ' ' + H);
    svg.setAttribute('class','chart');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','燃費の推移グラフ');

    function el(tag, attrs){
      var n = document.createElementNS(svgNS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }

    // gridlines (min/mid/max)
    [yMin, (yMin+yMax)/2, yMax].forEach(function(v){
      svg.appendChild(el('line', {x1:padL, x2:W-padR, y1:y(v).toFixed(1), y2:y(v).toFixed(1), class:'gridline'}));
    });
    var lbl = el('text', {x:4, y:(y(yMax)+4).toFixed(1), class:'axislabel'}); lbl.textContent = yMax.toFixed(1); svg.appendChild(lbl);
    var lbl2 = el('text', {x:4, y:(y(yMin)+4).toFixed(1), class:'axislabel'}); lbl2.textContent = yMin.toFixed(1); svg.appendChild(lbl2);

    // average dashed line
    svg.appendChild(el('line', {x1:padL, x2:W-padR, y1:y(avg).toFixed(1), y2:y(avg).toFixed(1), class:'avgline'}));

    svg.appendChild(el('path', {d:areaPath, class:'area'}));
    svg.appendChild(el('path', {d:linePath, class:'line'}));

    // x labels: first + last date
    var xl1 = el('text', {x:x(0).toFixed(1), y:H-4, class:'axislabel', 'text-anchor':'start'}); xl1.textContent = fmtDateShort(pts[0].date); svg.appendChild(xl1);
    var xl2 = el('text', {x:x(pts.length-1).toFixed(1), y:H-4, class:'axislabel', 'text-anchor':'end'}); xl2.textContent = fmtDateShort(pts[pts.length-1].date); svg.appendChild(xl2);

    var dots = [];
    pts.forEach(function(p,i){
      var d = el('circle', {cx:x(i).toFixed(1), cy:y(computeEfficiency(p)).toFixed(1), r:4, class:'dot', tabindex:'0'});
      d.addEventListener('pointerenter', function(){ showTip(p, d); });
      d.addEventListener('focus', function(){ showTip(p, d); });
      d.addEventListener('click', function(){ showTip(p, d); });
      d.addEventListener('pointerleave', function(){ hideTip(); });
      d.addEventListener('blur', function(){ hideTip(); });
      svg.appendChild(d);
      dots.push(d);
    });

    els.chartWrap.appendChild(svg);

    function showTip(p, dotEl){
      dots.forEach(function(dd){ dd.classList.remove('active'); });
      dotEl.classList.add('active');
      var rect = dotEl.getBoundingClientRect();
      var wrapRect = els.chartWrap.getBoundingClientRect();
      els.chartTooltip.textContent = fmtDateShort(p.date) + '・' + computeEfficiency(p).toFixed(1) + ' km/L';
      els.chartTooltip.style.left = (rect.left - wrapRect.left + rect.width/2) + 'px';
      els.chartTooltip.style.top = (rect.top - wrapRect.top) + 'px';
      els.chartTooltip.classList.add('show');
    }
    function hideTip(){
      dots.forEach(function(dd){ dd.classList.remove('active'); });
      els.chartTooltip.classList.remove('show');
    }
  }

  function renderLog(entries){
    var filtered = state.filter==='all' ? entries : entries.filter(function(e){ return state.filter==='fuel' ? e.type==='fuel' : e.type!=='fuel'; });
    els.logList.innerHTML = '';
    if (!filtered.length){
      var empty = document.createElement('div');
      empty.className = 'empty-log';
      empty.textContent = '記録がありません';
      els.logList.appendChild(empty);
      return;
    }
    var fuelWithEff = entries.filter(function(e){ return e.type==='fuel' && computeEfficiency(e)!==null; });
    var avg = fuelWithEff.length ? fuelWithEff.reduce(function(s,e){ return s+computeEfficiency(e); },0)/fuelWithEff.length : null;

    filtered.forEach(function(e){
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card ' + e.type;
      var stripe = document.createElement('div'); stripe.className='stripe'; card.appendChild(stripe);
      var body = document.createElement('div'); body.className='body';

      var row1 = document.createElement('div'); row1.className='row1';
      var date = document.createElement('div'); date.className='date mono'; date.textContent = fmtDateLong(e.date);
      var kind = document.createElement('div'); kind.className='kind'; kind.textContent = e.type==='fuel' ? '給油' : (e.type==='cost' ? (e.category || 'その他') : '整備');
      row1.appendChild(date); row1.appendChild(kind);
      body.appendChild(row1);

      if (e.type === 'fuel'){
        var main = document.createElement('div'); main.className='main mono';
        var mainParts = [];
        if (typeof e.distanceKm === 'number') mainParts.push(num(e.distanceKm,0) + ' km');
        if (typeof e.liters === 'number') mainParts.push(num(e.liters,1) + ' L');
        main.textContent = mainParts.length ? mainParts.join(' / ') : '未記録';
        body.appendChild(main);

        var metaParts = [];
        if (typeof e.odometerKm === 'number') metaParts.push('メーター ' + num(e.odometerKm,0) + ' km');

  function prevOdoEntry(dateStr, odo, excludeId){
    var best = null;
    state.entries.forEach(function(e){
      if (e.type !== 'fuel' || typeof e.odometerKm !== 'number' || e.id === excludeId) return;
      var before = e.date < dateStr || (e.date === dateStr && e.odometerKm < odo);
      if (!before) return;
      if (!best || e.date > best.date || (e.date === best.date && e.odometerKm > best.odometerKm)) best = e;
    });
    return best;
  }

  // 写真を縮小して JPEG の base64 にする(通信量と読み取り料金を抑える)
  function shrinkImage(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var max = 1800, w = img.naturalWidth, h = img.naturalHeight;
        var k = Math.min(1, max / Math.max(w, h));
        var cw = Math.round(w*k), ch = Math.round(h*k);
        var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        var dataUrl = cv.toDataURL('image/jpeg', 0.85);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }

  function numOrNull(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }

  function applyScan(r){
    var type = (r.type === 'fuel') ? 'fuel' : 'cost';
    resetItems();
    fOdo.value = ''; els.fDistance.readOnly = false; odoComputed.textContent = '';
    setType(type);
    if (typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) els.fDate.value = r.date;
    els.fNote.value = (typeof r.note === 'string') ? r.note : '';
    if (type === 'fuel'){
      var od = numOrNull(r.odometerKm);
      fOdo.value = od !== null ? od : '';
      refreshOdo();
      var l = numOrNull(r.liters), p = numOrNull(r.unitPrice), a = numOrNull(r.amount);
      els.fLiters.value = l !== null ? l : '';
      els.fPrice.value = p !== null ? p : '';
      els.fAmount.value = a !== null ? a : ((l !== null && p !== null) ? Math.round(l*p) : '');
      els.ampComputed.textContent = '';
      recalcEffPreview();
    } else {
      var ca = numOrNull(r.amount);
      els.fCostAmount.value = ca !== null ? ca : '';
    }
    state.scanned = true;
  }

  scanBtn.addEventListener('click', function(){
    if (!SCAN_URL){ scanSay('写真読み取りは準備中です(設定がまだ終わっていません)。', true); return; }
    scanInput.value = '';
    scanInput.click();

  scanInput.addEventListener('change', function(){
    var file = scanInput.files && scanInput.files[0];
    if (!file) return;
    scanBtn.disabled = true;
    scanBtn.textContent = '読み取り中…(数十秒かかることがあります)';
    scanSay('');
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 90000);
    shrinkImage(file).then(function(b64){
      return fetch(SCAN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: b64, mediaType: 'image/jpeg' }),
        signal: ctrl ? ctrl.signal : undefined
      });
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(body){
        if (!res.ok || !body || body.error){
          var m = (body && body.message) ? body.message : ('読み取りに失敗しました(' + res.status + ')');
          throw new Error(m);
        }
        return body;
      });
    }).then(function(r){
      applyScan(r);
      scanSay('読み取りました。内容を必ず確認してから保存してください。', false);
    }).catch(function(err){
      var m = (err && err.name === 'AbortError') ? '時間がかかりすぎました。もう一度試してください。'
            : (err && err.message === 'image') ? '写真を開けませんでした。別の写真で試してください。'
            : (err && err.message) ? err.message : '読み取りに失敗しました。';
      if (err instanceof TypeError) m = '通信できませんでした。電波を確認してもう一度試してください。';
      scanSay(m, true);
    }).then(function(){
      clearTimeout(timer);
      scanBtn.disabled = false;
      scanBtn.textContent = '📷 写真から入力(レシート・請求書)';
    });
  });

  /* ---------- persistence (localStorage) ---------- */

  function newId(){ return 'e-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }

  // メーター方式の起点は 2026/10/3(レシート写真のメーター 37,209km、走行距離 813km)。それ以前の記録はメーター不明のまま
  // 試作版で一時的に入った計算値(下の表と一致するもの)だけを取り除く。ご自身で入れた値は触らない
  var TEMP_ODOMETER = {
    'seed-2': [36887, 36396], 'seed-3': [36361, 35870], 'seed-4': [35775, 35284], 'seed-5': [35200, 34709],
    'seed-6': [34594, 34103], 'seed-7': [33877, 33386], 'seed-8': [32980, 32489], 'seed-9': [32153, 31662],
    'seed-10': [31262, 30771]
  };
  function backfillOdo(list){
    list.forEach(function(e){
      if (e.type !== 'fuel') return;
      var t = TEMP_ODOMETER[e.id];
      if (t && typeof e.odometerKm === 'number' && t.indexOf(e.odometerKm) >= 0) delete e.odometerKm;
      if (e.date === '2026-10-03' && e.distanceKm === 813 && typeof e.odometerKm !== 'number') e.odometerKm = 37209;
    });
  }
  // メーターのある給油どうしは、走行距離 = 今回のメーター − 前回のメーター
  function recomputeDistances(list){
    var fuel = list.filter(function(e){ return e.type === 'fuel' && typeof e.odometerKm === 'number'; })
      .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.odometerKm - b.odometerKm; });
    for (var i = 1; i < fuel.length; i++){
      var d = fuel[i].odometerKm - fuel[i-1].odometerKm;
      if (d > 0 && fuel[i].distanceKm !== d) fuel[i].distanceKm = d;
    }
  }

  function persist(){
    backfillOdo(state.entries);
    recomputeDistances(state.entries);
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ version:1, entries: state.entries }));
      return true;
    } catch(e){
      console.log('persist failed', e);
      return false;
    }
  }

  function loadStore(){
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch(e){}
    if (raw){
      try {
        var obj = JSON.parse(raw);
        if (obj && Array.isArray(obj.entries)){ state.entries = obj.entries; persist(); return state.entries; }
      } catch(e){ console.log('parse failed', e); }
    }
    // 初回起動: 初期データ(Artifact版から移行した記録)を投入
    var seeded = INITIAL_ENTRIES.map(function(e){ return Object.assign({}, e); });
    state.entries = seeded;
    persist();
    return seeded;
  }

  function saveEntry(id, data){
    if (id){
      var idx = state.entries.findIndex(function(e){ return e.id === id; });
      var merged = Object.assign({id:id}, data);
      if (idx >= 0) state.entries[idx] = merged; else state.entries.push(merged);
    } else {
      state.entries.push(Object.assign({id:newId()}, data));
    }
    persist();
    render();
  }

  function deleteEntry(id){
    state.entries = state.entries.filter(function(e){ return e.id !== id; });
    persist();
    render();
  }

  els.fabSettings.addEventListener('click', function(){ setMsg(''); els.settingsOverlay.hidden = false; });
  els.btnSettingsClose.addEventListener('click', function(){ els.settingsOverlay.hidden = true; });
  els.settingsOverlay.addEventListener('click', function(ev){ if (ev.target === els.settingsOverlay) els.settingsOverlay.hidden = true; });

  els.btnExport.addEventListener('click', function(){
    var payload = JSON.stringify({ app:'pit-log', version:1, exportedAt:new Date().toISOString(), entries: state.entries }, null, 2);
    var name = exportFileName();
    var blob = new Blob([payload], { type:'application/json' });
    var file = null;
    try { file = new File([blob], name, { type:'application/json' }); } catch(e){}

    // iPhone/Android: 共有シート(「ファイルに保存」など)を優先
    if (file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
      navigator.share({ files:[file], title:'Pit Log バックアップ' }).then(function(){
        setMsg('書き出しました(' + state.entries.length + '件)');
      }).catch(function(err){
        if (err && err.name === 'AbortError') return;
        fallbackDownload(blob, name);
      });
      return;
    }
    fallbackDownload(blob, name);
  });

  function fallbackDownload(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    setMsg('書き出しました(' + state.entries.length + '件)');
  }

  els.btnImportFile.addEventListener('click', function(){ els.fileInput.value = ''; els.fileInput.click(); });

  function cleanNum(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }

  els.fileInput.addEventListener('change', function(){
    var f = els.fileInput.files && els.fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var obj;
      try { obj = JSON.parse(reader.result); } catch(e){ setMsg('ファイルを読み込めませんでした(JSON形式ではありません)', true); return; }
      var list = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.entries) ? obj.entries : null);
      if (!list){ setMsg('Pit Logのバックアップファイルではないようです', true); return; }
      var added = 0, updated = 0, skipped = 0;
      list.forEach(function(raw){
        if (!raw || typeof raw !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(raw.date || '')){ skipped++; return; }
        var type = (raw.type === 'maintenance' || raw.type === 'cost') ? raw.type : 'fuel';
        var rec = {
          id: (typeof raw.id === 'string' && raw.id) ? raw.id : newId(),
          type: type, date: raw.date,
          distanceKm: cleanNum(raw.distanceKm),
          odometerKm: (type === 'fuel') ? cleanNum(raw.odometerKm) : undefined,
          liters: cleanNum(raw.liters), unitPrice: cleanNum(raw.unitPrice), amount: cleanNum(raw.amount),
          note: typeof raw.note === 'string' ? raw.note : '',
          category: (type === 'cost' && typeof raw.category === 'string') ? raw.category : undefined,
          items: (type === 'maintenance' && Array.isArray(raw.items)) ? raw.items.filter(function(i){ return i && typeof i === 'object'; }).map(function(i){
            return { label: typeof i.label === 'string' ? i.label : '', amount: cleanNum(i.amount), group: i.group === 'legal' ? 'legal' : 'work' };
          }) : undefined,
          source: typeof raw.source === 'string' ? raw.source : 'import',
          updatedAt: typeof raw.updatedAt === 'string' ? raw.updatedAt : new Date().toISOString()
        };
        var idx = state.entries.findIndex(function(e){ return e.id === rec.id; });
        if (idx >= 0){ state.entries[idx] = rec; updated++; } else { state.entries.push(rec); added++; }
      });
      persist(); render();
      setMsg('読み込みました(追加 ' + added + '件 / 上書き ' + updated + '件' + (skipped ? ' / 読み飛ばし ' + skipped + '件' : '') + ')');
    };
    reader.onerror = function(){ setMsg('ファイルを読み込めませんでした', true); };
    reader.readAsText(f);
  });

  /* ---------- boot ---------- */

  state.entries = loadStore();
  render();

  if (navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(function(){});
  }
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){ console.log('sw failed', err); });
    });
  }
})();
</script>
</body>
</html>
